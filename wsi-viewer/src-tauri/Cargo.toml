[package]
name = "app"
version = "0.1.0"
description = "WSI Hive Tauri shell"
authors = ["wsi-hive"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
http = "1.3"
http-range = "0.1"
base64 = "0.22"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
walkdir = "2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
urlencoding = "2.1"
